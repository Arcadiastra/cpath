name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Verify tag matches bin/cpath VERSION
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$'; then
            echo "Invalid release tag: $TAG_NAME" >&2
            exit 1
          fi
          tag_version="${TAG_NAME#v}"
          script_version=$(sed -n 's/^VERSION="\([^"]*\)"$/\1/p' bin/cpath | head -n 1)
          if [ "$tag_version" != "$script_version" ]; then
            echo "Tag version ($tag_version) does not match bin/cpath VERSION ($script_version)" >&2
            exit 1
          fi
      - name: Lint shell scripts
        run: |
          shellcheck bin/cpath install.sh uninstall.sh completions/cpath.bash \
            packaging/build-deb.sh packaging/render-homebrew-formula.sh \
            tests/test_cpath.sh tests/test_macos_clipboard.sh
      - name: Validate man page
        run: groff -man -Tutf8 -ww -z man/cpath.1
      - name: Run CLI test suite
        run: bash tests/test_cpath.sh

  verify-macos:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Run CLI suite with macOS system tools
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        env:
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        run: /bin/bash tests/test_cpath.sh
      - name: Verify native macOS pasteboard
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        env:
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        run: /bin/bash tests/test_macos_clipboard.sh

  release:
    needs: [verify-linux, verify-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Build release artifacts (.tar.gz, .deb, Homebrew formula, SHA256SUMS)
        env:
          TAG_NAME: ${{ github.ref_name }}
          CPATH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          mkdir -p dist

          # 1. Deterministic source tarball for Homebrew & manual builds
          git archive --format=tar.gz --prefix="cpath-${version}/" -o "dist/cpath-${version}.tar.gz" HEAD

          # 2. Debian/Ubuntu .deb package
          ./packaging/build-deb.sh "$version" dist
          dpkg-deb --info "dist/cpath_${version}_all.deb"
          dpkg-deb --contents "dist/cpath_${version}_all.deb"

          # 3. Smoke-test installing and running the .deb package on Ubuntu
          sudo apt-get install -y "./dist/cpath_${version}_all.deb"
          test "$(/usr/bin/cpath --version)" = "cpath ${version}"
          test -f /usr/share/bash-completion/completions/cpath
          test -f /usr/share/zsh/vendor-completions/_cpath
          man -w cpath >/dev/null
          sudo apt-get remove -y cpath

          # 4. Render Homebrew formula with exact tarball SHA256
          tarball_sha=$(sha256sum "dist/cpath-${version}.tar.gz" | awk '{print $1}')
          ./packaging/render-homebrew-formula.sh "$version" "$tarball_sha" "dist/cpath.rb"
          ruby -c "dist/cpath.rb"

          # 5. Checksums
          (
            cd dist
            sha256sum "cpath-${version}.tar.gz" "cpath_${version}_all.deb" > SHA256SUMS.txt
          )
          cat dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          assets=(
            "dist/cpath_${version}_all.deb"
            "dist/cpath-${version}.tar.gz"
            "dist/cpath.rb"
            "dist/SHA256SUMS.txt"
          )
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" \
              --title "$TAG_NAME" \
              --generate-notes
          fi
      - name: Sync Homebrew tap (optional, requires HOMEBREW_TAP_TOKEN)
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'Arcadiastra/homebrew-tap' }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "The default Homebrew tap imports the public release formula on its own schedule."
            exit 0
          fi
          version="${TAG_NAME#v}"
          tap_dir=$(mktemp -d)
          trap 'rm -rf "$tap_dir"' EXIT
          auth_b64=$(printf 'x-access-token:%s' "$HOMEBREW_TAP_TOKEN" | base64 | tr -d '\r\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_b64}" \
            clone --depth 1 "https://github.com/${TAP_REPO}.git" "$tap_dir"
          mkdir -p "$tap_dir/Formula"
          cp "dist/cpath.rb" "$tap_dir/Formula/cpath.rb"
          cd "$tap_dir"
          if ! git diff --quiet -- Formula/cpath.rb 2>/dev/null || [ -n "$(git status --porcelain -- Formula/cpath.rb)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Formula/cpath.rb
            git commit -m "cpath ${version}"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_b64}" push origin HEAD
          else
            echo "Homebrew tap formula is already up to date."
          fi
